<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mobile Programming - Firebase Student Portal</title>
  <style>
    body { font-family: sans-serif; margin: 30px; background-color: #fafafa; }
    input { margin: 4px; padding: 5px; max-width: 120px; border: 1px solid #aaa; }
    button { padding: 4px 10px; font-weight: bold; cursor: pointer; }
    hr { margin: 25px 0; border: 0; border-top: 1px dashed #ccc; }
    h2, h3 { color: #2c3e50; }
  </style>
</head>
<body>

  <h1>Firebase Realtime Database Student CRUD</h1>
  <script type="module" src="main.js"></script>

  <h2>Create / Write User</h2>
  <input type="text" id="create-id" placeholder="User ID" />
  <input type="text" id="create-firstName" placeholder="First Name" />
  <input type="text" id="create-lastName" placeholder="Last Name" />
  <input type="number" id="create-age" placeholder="Age" />
  <input type="text" id="create-gender" placeholder="Gender" />
  <input type="email" id="create-email" placeholder="Email" />
  <input type="text" id="create-phone" placeholder="Phone Number" />
  <input type="text" id="create-address" placeholder="Address" />
  <input type="text" id="create-course" placeholder="Course" />
  <input type="number" id="create-semester" placeholder="Semester" />
  <input type="number" id="create-enrollmentYear" placeholder="Enrollment Year" />
  
  <button onclick="writeStudentData(
    document.getElementById('create-id').value,
    document.getElementById('create-firstName').value,
    document.getElementById('create-lastName').value,
    document.getElementById('create-age').value,
    document.getElementById('create-gender').value,
    document.getElementById('create-email').value,
    document.getElementById('create-phone').value,
    document.getElementById('create-address').value,
    document.getElementById('create-course').value,
    document.getElementById('create-semester').value,
    document.getElementById('create-enrollmentYear').value
  )">Write User</button>

  <hr />

  <h2>Read Users</h2>
  <button onclick="readAllStudents()">Read All Users (Check Console)</button>

  <h3>Read One User by ID</h3>
  <input type="text" id="read-id" placeholder="User ID" />
  <button onclick="readStudentById(document.getElementById('read-id').value)">Read User</button>
  <p id="read-result" style="color: blue; font-weight: bold;"></p>

  <hr />

  <h2>Update User</h2>
  <input type="text" id="update-id" placeholder="User ID" />
  <button onclick="fetchStudentForUpdate(document.getElementById('update-id').value)">Fetch User</button>
  <br /><br />
  
  <input type="text" id="update-firstName" placeholder="New First Name" />
  <input type="text" id="update-lastName" placeholder="New Last Name" />
  <input type="number" id="update-age" placeholder="New Age" />
  <input type="text" id="update-gender" placeholder="New Gender" />
  <input type="email" id="update-email" placeholder="New Email" />
  <input type="text" id="update-phone" placeholder="New Phone" />
  <input type="text" id="update-address" placeholder="New Address" />
  <input type="text" id="update-course" placeholder="New Course" />
  <input type="number" id="update-semester" placeholder="New Sem" />
  <input type="number" id="update-enrollmentYear" placeholder="New Year" />
  
  <button onclick="updateStudentData(
    document.getElementById('update-id').value,
    {
      firstName: document.getElementById('update-firstName').value,
      lastName: document.getElementById('update-lastName').value,
      age: parseInt(document.getElementById('update-age').value) || 0,
      gender: document.getElementById('update-gender').value,
      email: document.getElementById('update-email').value,
      phone: parseInt(document.getElementById('update-phone').value) || 0,
      address: document.getElementById('update-address').value,
      course: document.getElementById('update-course').value,
      semester: parseInt(document.getElementById('update-semester').value) || 0,
      enrollmentYear: parseInt(document.getElementById('update-enrollmentYear').value) || 0
    }
  )">Update User</button>

  <hr />

  <h2>Delete User</h2>
  <input type="text" id="delete-id" placeholder="User ID" />
  <button onclick="deleteStudentData(document.getElementById('delete-id').value)">Delete User</button>

</body>
</html>
