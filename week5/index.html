<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mobile Programming - Student Data</title>
</head>
<body>
  <h2>Student Data Saved to Firebase</h2>
  <p id="status">Saving data...</p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

    // ✅ Your real Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyA0mbmLEkTO8Hdc0t6ZzZjsycrjBGjE3Ew",
      authDomain: "mobile-program-4ae69.firebaseapp.com",
      databaseURL: "https://mobile-program-4ae69-default-rtdb.firebaseio.com",
      projectId: "mobile-program-4ae69",
      storageBucket: "mobile-program-4ae69.firebasestorage.app",
      messagingSenderId: "536089823127",
      appId: "1:536089823127:web:4a30390926c718115426d2"
    };

    // ✅ Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ✅ Save student data with 10 fields
    set(ref(db, 'students/1'), {
      firstName: "Bhichhu",
      lastName: "Prasai",
      age: 21,
      gender: "Female",
      email: "pbhichhu@gmail.com",
      phone: 9876543210,
      address: "Kathmandu",
      course: "Mobile Programming",
      semester: 7,
      enrollmentYear: 2022
    })
    .then(() => {
      console.log("✅ Data saved successfully!");
      document.getElementById("status").innerText = "✅ Data saved to Firebase successfully!";
      document.getElementById("status").style.color = "green";
    })
    .catch((error) => {
      console.error("❌ Error:", error);
      document.getElementById("status").innerText = "❌ Error: " + error.message;
      document.getElementById("status").style.color = "red";
    });

  </script>
</body>
</html>
